<!doctype html>
<html lang="es" data-theme="laboratory">
<head>
  <meta charset="utf-8">
  <title>MicroFoodScan · Lectura LFA</title>
  <base href="/">
  <script>
    (function () {
      var base = document.querySelector('base');
      var isGitHubPages = location.hostname.endsWith('github.io');
      var repoBase = '/TFG-2026-2027/';
      base.setAttribute('href', isGitHubPages ? repoBase : '/');

      var redirect = sessionStorage.getItem('mfs-redirect');
      if (!redirect) return;
      sessionStorage.removeItem('mfs-redirect');
      if (redirect !== location.href) history.replaceState(null, '', redirect);
    })();
  </script>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#203500">
  <meta name="description" content="Captura, comprueba y revisa imágenes de matrices de señales LFA en tu dispositivo. Prototipo de investigación pendiente de calibración.">
  <link rel="icon" type="image/svg+xml" href="assets/mfs-manzana-camara.svg">
</head>
<body><app-root></app-root><noscript>MicroFoodScan necesita JavaScript para procesar las imágenes localmente.</noscript></body>
</html>
